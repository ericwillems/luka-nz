baseURL: "https://ericwillems.com/luka-nz/"
title: "Luka.nz"
locale: "en-NZ"
theme: "PaperMod"
metaDataFormat: "yaml"

# Output formats
outputs:
  home:
    - HTML
    - JSON

# Pagination
paginate: 10

# Markup
markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ""
    lineNos: false
    lineNumbersInTable: false
    noClasses: true
    noHl: false
    style: "github-dark"
    tabWidth: 4

# Taxonomies
taxonomies:
  tag: tags

params:
  mainSections:
    - cards
