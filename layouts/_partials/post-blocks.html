{{- $page := . -}}
<div class="post-content-blocks image-group-container">
  {{- range .Params.blocks }}
    {{- $block := . }}
    {{- with .text }}
    <div class="post-text-block md-content">
      {{ $page.RenderString . }}
    </div>
    {{- end }}
    {{- with .image }}
      {{- $src := partial "image-src.html" . }}
      <figure class="image-block{{ if or $block.caption $block.description }} image-block--captioned{{ else }} image-block--uncaptioned{{ end }}">
        <img src="{{ $src }}" alt="{{ $block.alt }}" loading="lazy">
        {{- if or $block.caption $block.description }}
        <figcaption>
          {{- with $block.caption }}<span class="image-caption">{{ . | markdownify }}</span>{{ end }}
          {{- with $block.description }}<span class="image-description">{{ . | markdownify }}</span>{{ end }}
        </figcaption>
        {{- end }}
      </figure>
    {{- end }}
  {{- end }}
</div>
