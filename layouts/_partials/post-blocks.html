{{- $page := . -}}
<div class="post-content-blocks image-group-container">
  {{- range .Params.blocks }}
    {{- $block := . }}
    {{- with .text }}
    <div class="post-text-block md-content">
      {{ $page.RenderString . }}
    </div>
    {{- end }}
    {{- with .image }}
      {{- $src := partial "image-src.html" . }}
      <figure class="image-block{{ if $block.caption }} image-block--captioned{{ else }} image-block--uncaptioned{{ end }}">
        <img src="{{ $src }}" alt="" loading="lazy">
        {{- with $block.caption }}
        <figcaption>
          <span class="image-caption">{{ . | markdownify }}</span>
        </figcaption>
        {{- end }}
      </figure>
    {{- end }}
  {{- end }}
</div>
