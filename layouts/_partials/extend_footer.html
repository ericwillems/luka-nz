<script defer src="{{ "js/image-groups.js" | relURL }}"></script>
<dialog class="card-image-viewer" aria-label="Card image viewer">
  <button class="card-image-viewer__close" type="button" aria-label="Close image viewer">&times;</button>
  <button class="card-image-viewer__navigation card-image-viewer__previous" type="button" aria-label="Previous image">&larr;</button>
  <figure class="card-image-viewer__figure">
    <img class="card-image-viewer__image" alt="">
    <figcaption class="card-image-viewer__caption" aria-live="polite"></figcaption>
  </figure>
  <button class="card-image-viewer__navigation card-image-viewer__next" type="button" aria-label="Next image">&rarr;</button>
</dialog>
<script defer src="{{ "js/card-image-viewer.js" | relURL }}"></script>
