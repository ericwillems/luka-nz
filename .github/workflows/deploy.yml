name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hugo-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      - name: Test content reference synchronization
        run: ruby tests/sync-content-references_test.rb

      - name: Synchronize ordered content references
        if: github.event_name == 'push'
        run: |
          ruby scripts/sync-content-references.rb
          if ! git diff --quiet -- content/volumes content/chapters content/cards; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/volumes content/chapters content/cards
            git commit -m "Sync ordered content references" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Build site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
