media:
  input: assets/images
  output: /images
content:
  - name: volumes
    label: Volumes
    type: collection
    path: content/volumes
    exclude: ["_index.md"]
    view:
      fields: [ title, weight, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: draft, label: Draft, type: boolean }
      - name: cover
        label: Banner Image
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: caption, label: Caption, type: string }
      - { name: body, label: Volume Content, type: rich-text }
      - name: chapters
        label: Chapters (display order)
        type: reference
        list: true
        options:
          collection: chapters
          value: "{path}"
          label: "{title}"
      - { name: url, label: URL, type: string }
      - { name: weight, label: Navigation Order, type: number }
  - name: chapters
    label: Chapters
    type: collection
    path: content/chapters
    exclude: ["_index.md"]
    view:
      fields: [ title, volume, card_limit, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Chapter Content, type: rich-text }
      - { name: url, label: URL, type: string }
      - { name: card_limit, label: Cards Shown, type: number }
      - name: volume
        label: Volume
        type: reference
        required: true
        options:
          collection: volumes
          value: "{path}"
          label: "{title}"
      - name: cards
        label: Cards (display order)
        type: reference
        list: true
        options:
          collection: cards
          value: "{path}"
          label: "{title}"
  - name: cards
    label: Cards
    type: collection
    path: content/cards
    exclude: ["_index.md"]
    filename: "{primary}.md"
    view:
      primary: title
      fields: [ title, chapter, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: draft, label: Draft, type: boolean }
      - name: chapter
        label: Chapter
        type: reference
        required: true
        options:
          collection: chapters
          value: "{path}"
          label: "{title}"
      - { name: hide_title, label: Hide Title, type: boolean, default: false }
      - name: images
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Image ({index})"
        fields:
          - { name: image, label: Image, type: image, required: true }
          - { name: caption, label: Caption, type: string }
      - { name: body, label: Card Content, type: rich-text }
  - name: home
    label: Home Page
    type: file
    path: content/_index.md
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: draft, label: Draft, type: boolean }
      - { name: description, label: Description, type: string }
      - { name: body, label: Body, type: rich-text }
      - name: cover
        label: Banner Image
        type: object
        fields:
          - { name: image, label: Image, type: image }

