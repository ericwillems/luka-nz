media:
  input: assets/images
  output: /images
content:
  - name: pages
    label: Pages
    type: collection
    path: content/pages
    view:
      fields: [ title, weight, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: url, label: URL, type: string }
      - { name: weight, label: Navigation Order, type: number }
      - { name: description, label: Description, type: string }
      - name: cover
        label: Banner Image
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: caption, label: Caption, type: string }
      - name: related_topics
        label: Related Topics
        type: reference
        list: true
        options:
          collection: topics
          value: "{path}"
          label: "{title}"
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Page Content, type: rich-text }
  - name: topics
    label: Topics
    type: collection
    path: content/topics
    view:
      fields: [ title, page, post_limit, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: url, label: URL, type: string }
      - { name: description, label: Description, type: string }
      - { name: post_limit, label: Topic Posts Shown on Page, type: number }
      - name: page
        label: Page
        type: reference
        options:
          collection: pages
          value: "{path}"
          label: "{title}"
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Topic Content, type: rich-text }
  - name: posts
    label: Topic Posts
    type: collection
    path: content/posts
    view:
      fields: [ title, topic, date, draft ]
    fields:
      - { name: title, label: Title, type: string }
      - { name: topic, label: Topic, type: reference, required: true, options: { collection: topics, value: "{path}", label: "{title}" } }
      - { name: date, label: Date, type: date }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Post Text, type: rich-text }
      - name: blocks
        label: Post Content (in order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Content block ({index})"
        fields:
          - { name: text, label: Text (optional), type: rich-text }
          - { name: image, label: Image (optional), type: image }
          - { name: caption, label: Image Caption / Description, type: string }
  - name: home
    label: Home Page
    type: file
    path: content/_index.md
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string }
      - name: cover
        label: Banner Image
        type: object
        fields:
          - { name: image, label: Image, type: image }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text }

