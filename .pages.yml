media:
  input: assets/images
  output: /images
content:
  - name: topics
    label: Topics
    type: collection
    path: content/topics
    view:
      fields: [ title, parent, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Topic Introduction and Content, type: rich-text }
      - { name: url, label: URL, type: string }
      - { name: description, label: Description, type: string }
      - name: parent
        label: Parent Topic (choose a top-level topic)
        type: reference
        options:
          collection: topics
          value: "{path}"
          label: "{title}"
      - name: cover
        label: Banner Image
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: caption, label: Caption, type: string }
      - name: menu
        label: Main Menu
        type: object
        fields:
          - name: main
            type: object
            fields:
              - { name: name, label: Menu Label, type: string }
              - { name: weight, label: Menu Order, type: number }
  - name: posts
    label: Topic Posts
    type: collection
    path: content/posts
    view:
      fields: [ title, topic, date, draft ]
    fields:
      - { name: title, label: Title, type: string }
      - { name: topic, label: Topic, type: reference, required: true, options: { collection: topics, value: "{path}", label: "{title}" } }
      - { name: date, label: Date, type: date }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Post Text, type: rich-text }
      - name: blocks
        label: Post Content (in order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Content block ({index})"
        fields:
          - { name: text, label: Text (optional), type: rich-text }
          - { name: image, label: Image (optional), type: image }
          - { name: caption, label: Image Caption / Description, type: string }
  - name: home
    label: Home Page
    type: file
    path: content/_index.md
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text }
      - { name: description, label: Description, type: string }
      - name: cover
        label: Banner Image
        type: object
        fields:
          - { name: image, label: Image, type: image }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text }
          - { name: alt, label: Alt Text, type: string }

